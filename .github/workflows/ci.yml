name: Validation Homelab

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Vérification de l'infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Installer les collections Ansible
        run: |
          ansible-galaxy collection install community.docker

      - name: Vérifier la syntaxe du playbook principal
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.ini site.yml --syntax-check

      - name: Vérifier Docker Compose - Monitoring
        run: |
          docker compose -f monitoring/compose.yml config

      - name: Vérifier Docker Compose - Caddy
        run: |
          docker compose -f caddy/compose.yml config
