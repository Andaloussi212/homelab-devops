name: Validation Homelab

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Vérification de l'infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Ansible et ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible shellcheck

      - name: Installer les collections Ansible
        run: |
          ansible-galaxy collection install community.docker

      - name: Vérifier la syntaxe Ansible
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.ini site.yml --syntax-check

      - name: Vérifier Docker Compose - Monitoring
        run: |
          docker compose -f monitoring/compose.yml config

      - name: Vérifier Docker Compose - Caddy
        run: |
          docker compose -f caddy/compose.yml config

      - name: Vérifier la configuration Prometheus
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: Vérifier le Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:latest \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Vérifier le script Bash de sauvegarde
        run: |
          shellcheck scripts/backup-nextcloud.sh
